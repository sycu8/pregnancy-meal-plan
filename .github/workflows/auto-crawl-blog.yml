name: Auto crawl blog (min 2 posts/day)

on:
  workflow_dispatch: {}
  schedule:
    # Twice daily: 02:15 and 14:15 UTC (= 09:15 and 21:15 UTC+7) — at least 2 AI posts/day
    - cron: "15 2,14 * * *"

concurrency:
  group: auto-crawl-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl_publish_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Target >=2 published posts/day (2 runs × up to 2 successful publishes; skips no longer consume slots)
      BLOG_AUTO_PUBLISH_MAX: "2"
      BLOG_AUTO_QUEUE_MAX: "8"
      BLOG_EDITORIAL_SEED_MAX: "2"
      BLOG_FAIL_ON_ZERO_PUBLISH: "true"
      FEATURE_BLOG_AI_ENABLED: "true"
      AI_PROVIDER: "workers-ai"
      AI_GATEWAY_ID: default
      BLOG_AI_TEXT_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      BLOG_AI_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      BLOG_R2_BUCKET: bau-an-gi-exports
      BLOG_AI_IMAGES: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://pregnancymeal.tips
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply optional AI Gateway variables
        run: |
          if [ -n "${{ vars.AI_GATEWAY_ID }}" ]; then
            echo "AI_GATEWAY_ID=${{ vars.AI_GATEWAY_ID }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.BLOG_AI_TEXT_MODEL }}" ]; then
            echo "BLOG_AI_TEXT_MODEL=${{ vars.BLOG_AI_TEXT_MODEL }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.BLOG_AI_IMAGE_MODEL }}" ]; then
            echo "BLOG_AI_IMAGE_MODEL=${{ vars.BLOG_AI_IMAGE_MODEL }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.BLOG_R2_BUCKET }}" ]; then
            echo "BLOG_R2_BUCKET=${{ vars.BLOG_R2_BUCKET }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl + editorial seeds + AI publish EN/VI
        # Pipeline writes EN first, translates fully, asserts usable EN, then syncs manifests.
        # Keep going past individual source timeouts; only fail on hard script errors.
        run: npm run publish:blog:auto

      - name: Assert English ready + validate generated manifests
        run: |
          npm run assert:blog:en
          # Catch invalid import bindings (e.g. digit-leading slugs) before commit/deploy.
          npx tsx -e "import './src/lib/blog/en-post-manifest.ts'; import './src/lib/blog/post-manifest.ts'; console.log('[manifests] OK');"

      - name: Run tests
        run: npm test

      - name: Commit and push (if changed)
        id: commit
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes from crawl."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(blog): auto AI publish $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare

      # After new blog content is live, auto-post the latest EN draft to X + Facebook.
      # Requires repo secret CRON_SECRET (same value as Worker CRON_SECRET / MARKETING_API_KEY).
      - name: Auto-post latest to X + Facebook
        if: steps.commit.outputs.changed == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping social auto-post"
            exit 0
          fi
          echo "Waiting briefly for deploy propagation…"
          sleep 20
          for locale in en vi; do
            echo "Publishing locale=$locale"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              "https://pregnancymeal.tips/api/cron/social-publish?locale=${locale}&platforms=x,facebook&live=1" \
              | tee "/tmp/social-publish-${locale}.json"
            echo
          done
