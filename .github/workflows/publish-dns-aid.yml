name: Publish DNS-AID records

on:
  workflow_dispatch:
  push:
    paths:
      - "dns/dns-aid.zone"
      - "scripts/publish-dns-aid.mjs"
      - ".github/workflows/publish-dns-aid.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish DNS-AID SVCB/HTTPS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-dns-aid.mjs
